# Isolated public origin for the CONFENGE Twenty stack.
server {
    listen 80;
    listen [::]:80;
    server_name gestao.confenge.com.br;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name gestao.confenge.com.br;

    ssl_certificate /etc/letsencrypt/live/gestao.confenge.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gestao.confenge.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    access_log /var/log/nginx/gestao.confenge.com.br.access.log;
    error_log /var/log/nginx/gestao.confenge.com.br.error.log warn;

    # The CRM is authenticated and dynamic. Do not let an edge cache replay
    # session-specific API or application responses while the public edge is
    # being introduced.
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;

    client_max_body_size 50m;
    proxy_connect_timeout 15s;
    proxy_send_timeout 90s;
    proxy_read_timeout 90s;

    location / {
        proxy_pass http://127.0.0.1:18300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_gestao;
        proxy_buffering off;
    }
}
