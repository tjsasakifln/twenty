# Isolated public origin for the CONFENGE Twenty stack.
server {
    listen 80;
    listen [::]:80;
    server_name gestao.confenge.com.br;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name gestao.confenge.com.br;

    ssl_certificate /etc/letsencrypt/live/gestao.confenge.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gestao.confenge.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    access_log /var/log/nginx/gestao.confenge.com.br.access.log;
    error_log /var/log/nginx/gestao.confenge.com.br.error.log warn;

    # The CRM is authenticated and dynamic. Do not let an edge cache replay
    # session-specific API or application responses while the public edge is
    # being introduced.
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;

    client_max_body_size 50m;
    proxy_connect_timeout 15s;
    proxy_send_timeout 90s;
    proxy_read_timeout 90s;

    # Apply the auth-only selectors to every HTML document so the landing
    # document is covered before the SPA moves to /welcome.
    sub_filter_once on;
    sub_filter '</head>' '<link rel="stylesheet" href="/branding/confenge-auth.css?v=20261025"></head>';

    # CONFENGE's public wordmark is a static, transparent image.  Keep it
    # outside Twenty's private container so a pinned application upgrade cannot
    # overwrite it or widen access to its data directory.
    location = /branding/confenge-logo-white.png {
        alias /var/www/gestao-confenge-branding/confenge-logo-white.png;
        default_type image/png;
    }

    location = /branding/confenge-mark-white.png {
        alias /var/www/gestao-confenge-branding/confenge-mark-white.png;
        default_type image/png;
    }

    # Cover the document icon and the React fallback before workspace data
    # arrives. The workspace itself uses this same transparent PNG via its
    # native CorePicture setting once loaded.
    location = /images/icons/android/android-launchericon-48-48.png {
        alias /var/www/gestao-confenge-branding/confenge-mark-white.png;
        default_type image/png;
    }

    location = /images/icons/android/android-launchericon-192-192.png {
        alias /var/www/gestao-confenge-branding/confenge-mark-white.png;
        default_type image/png;
    }

    location = /images/icons/ios/192.png {
        alias /var/www/gestao-confenge-branding/confenge-mark-white.png;
        default_type image/png;
    }

    location = /branding/confenge-auth.css {
        alias /var/www/gestao-confenge-branding/confenge-auth.css;
        default_type text/css;
    }

    # Twenty v2.45 only serves the frontend document when the request accepts
    # HTML. Keep bare root probes compatible without changing API negotiation.
    location = / {
        proxy_pass http://127.0.0.1:18300;
        proxy_http_version 1.1;
        proxy_set_header Accept "text/html";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:18300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_gestao;
        proxy_set_header Accept-Encoding "";
        proxy_buffering off;
    }
}
