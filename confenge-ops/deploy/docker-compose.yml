name: confenge-gestao

x-logging: &logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  server:
    image: twentycrm/twenty:v2.45.0@sha256:81b6444c146fc39aec5e8de6ff6f996c78714910abf117f129ba78c925690dfd
    ports:
      - "127.0.0.1:18300:3000"
    volumes:
      - confenge-gestao-server-data:/app/packages/twenty-server/.local-storage
    environment:
      NODE_PORT: "3000"
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=1024
      PG_DATABASE_URL: postgres://${PG_DATABASE_USER}:${PG_DATABASE_PASSWORD}@db:5432/${PG_DATABASE_NAME}
      SERVER_URL: ${SERVER_URL}
      REDIS_URL: redis://redis:6379
      DISABLE_DB_MIGRATIONS: "false"
      DISABLE_CRON_JOBS_REGISTRATION: "false"
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      FALLBACK_ENCRYPTION_KEY: ${FALLBACK_ENCRYPTION_KEY:-}
      LOGIC_FUNCTION_TYPE: DISABLED
      CODE_INTERPRETER_TYPE: DISABLED
      IS_MULTIWORKSPACE_ENABLED: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:3000/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 300s
    restart: unless-stopped
    logging: *logging
    networks: [internal, edge]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1536M

  worker:
    image: twentycrm/twenty:v2.45.0@sha256:81b6444c146fc39aec5e8de6ff6f996c78714910abf117f129ba78c925690dfd
    command: ["yarn", "worker:prod"]
    volumes:
      - confenge-gestao-server-data:/app/packages/twenty-server/.local-storage
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=768
      PG_DATABASE_URL: postgres://${PG_DATABASE_USER}:${PG_DATABASE_PASSWORD}@db:5432/${PG_DATABASE_NAME}
      SERVER_URL: ${SERVER_URL}
      REDIS_URL: redis://redis:6379
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      FALLBACK_ENCRYPTION_KEY: ${FALLBACK_ENCRYPTION_KEY:-}
      LOGIC_FUNCTION_TYPE: LOCAL
      CODE_INTERPRETER_TYPE: DISABLED
      IS_MULTIWORKSPACE_ENABLED: "false"
    depends_on:
      db:
        condition: service_healthy
      server:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging
    networks: [internal]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M

  db:
    image: postgres:16.15@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
    volumes:
      - confenge-gestao-db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${PG_DATABASE_NAME}
      POSTGRES_USER: ${PG_DATABASE_USER}
      POSTGRES_PASSWORD: ${PG_DATABASE_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    logging: *logging
    networks: [internal]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  redis:
    image: redis:7.4.11-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "192mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - confenge-gestao-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: *logging
    networks: [internal]
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

networks:
  edge: {}
  internal:
    internal: true

volumes:
  confenge-gestao-db-data:
  confenge-gestao-server-data:
  confenge-gestao-redis-data:
